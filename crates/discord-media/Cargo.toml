[package]
name = "discord-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless Discord voice and video transport"
publish = false

[features]
default = []
native-video = ["call-media/video"]

[lints]
workspace = true

[dependencies]
discord-session = { path = "../discord-session", version = "0.1.0" }
call-media = { git = "https://github.com/jethac/call-media", rev = "840e73046585a7165f7fc7a5d848df56675b3b90" }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = { version = "1", features = ["raw_value"] }
zeroize = "1.8"
url = "2"
getrandom = "0.4"
davey = { path = "../../vendor/davey", version = "=0.1.4", default-features = false }
openmls = { version = "=0.8.1", default-features = false }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
opus2 = { version = "=0.4.0", default-features = false, features = ["backend-libopus", "static", "bundled"] }
openh264 = "=0.9.8"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
sha3 = { version = "=0.10.9", default-features = false }
openmls_rust_crypto = { path = "../../vendor/openmls_rust_crypto", version = "=0.5.1" }
openmls_basic_credential = "=0.5.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Media"] }
