[package]
name = "discord-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless Rust client facade for Discord calling"
readme = "README.md"
# Enable publication when a usable implementation and API are ready.
publish = false

[lints]
workspace = true

[dependencies]
discord-session = { path = "../discord-session", version = "0.1.0" }
discord-media = { path = "../discord-media", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[features]
default = []
devices = ["dep:call-media", "discord-media/native-video", "tokio/signal"]

[dependencies.call-media]
git = "https://github.com/jethac/call-media"
rev = "e2bd86c65fe289278bad3cb19da7ed206110d1d2"
features = ["audio", "video"]
optional = true

[[example]]
name = "call"
required-features = ["devices"]
